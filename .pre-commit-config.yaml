repos:
  - repo: https://github.com/asottile/add-trailing-comma.git
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
        exclude: packages/rapidy/docs/examples/.*

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: packages/rapidy/docs/examples/.*
      - id: check-added-large-files
      - id: check-ast
        exclude: docs/examples/.*
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    - id: name-tests-test
      args: [ --pytest-test-first ]
      exclude: ^packages/rapidy/tests/app_checkers.py|^packages/rapidy/tests/test_mypy/cases|^.*base.py|^.*helpers.py|^.*constants.py

  - repo: local
    hooks:
      - id: mypy
        name: mypy (workspace strict contracts)
        entry: >-
          uv run --python 3.13 mypy --strict
          packages/rapidy_core/rapidy_core
          packages/rapidy/rapidy
          packages/rapidy/tests/typecheck
          packages/rapidy_client/rapidy_client
          packages/rapidy_client/tests/typecheck
        language: system
        pass_filenames: false
        types_or:
          - python
          - pyi
        require_serial: true
        exclude: packages/rapidy/docs/examples/.*|^packages/rapidy/tests/mypy/cases/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [ --fix ]
        exclude: packages/rapidy/docs/examples/.*
      - id: ruff-format
        exclude: packages/rapidy/docs/examples/.*
