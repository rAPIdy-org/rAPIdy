repos:
  - repo: https://github.com/asottile/add-trailing-comma.git
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
        exclude: packages/rapidy/docs/examples/.*

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: packages/rapidy/docs/examples/.*
      - id: check-added-large-files
      - id: check-ast
        exclude: docs/examples/.*
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    - id: name-tests-test
      args: [ --pytest-test-first ]
      exclude: ^packages/rapidy/tests/app_checkers.py|^packages/rapidy/tests/test_mypy/cases|^.*base.py|^.*helpers.py|^.*constants.py

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        types_or:
          - python
          - pyi
        require_serial: true
        args: [--config-file=packages/rapidy/pyproject.toml]
        exclude: packages/rapidy/docs/examples/.*|^packages/rapidy/tests/mypy/cases/
        additional_dependencies: ["attrs==24.2.0"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [ --fix, --config=packages/rapidy/pyproject.toml ]
        exclude: packages/rapidy/docs/examples/.*
      - id: ruff-format
        args: [ --config=packages/rapidy/pyproject.toml ]
        exclude: packages/rapidy/docs/examples/.*
