site_name: rAPIdy
repo_name: rAPIdy-org/rAPIdy
repo_url: https://github.com/rAPIdy-org/rAPIdy

# The preserved 1.x pages remain in git for historical reference but are not part of the 2.0 site.
exclude_docs: |
  en/about/
  en/aiohttp_migration/
  en/docs/
  en/examples/
  en/home.md
  en/why/
  ru/about/
  ru/aiohttp_migration/
  ru/docs/
  ru/examples/
  ru/home.md
  ru/why/

theme:
  logo: assets/logo.png
  favicon: assets/logo.png
  name: material
  palette:
  - media: '(prefers-color-scheme: dark)'
    scheme: default
    primary: deep purple
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: light)'
    scheme: slate
    primary: deep purple
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
    # navigation
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.top
    - toc.follow

    # search
    - search.suggest
    - search.highlight
    - search.share

    # content
    - content.tabs.link
    - content.tooltips

    # content.code
    - content.code.annotate
    - content.code.copy
    - content.code.select

plugins:
  - search
  - redirects
  - mike:
      alias_type: symlink
      canonical_version: latest
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          link: /en/
          build: true
        - locale: ru
          name: Русский
          link: /ru/
          build: true

extra_css: [extra.css]

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - mdx_include:
      base_path: ./examples

nav:
- Home: index.md
- Quickstart: quickstart/index.md
- Guide:
  - Parameters and validation: guide/parameters.md
  - Dependency injection: guide/di.md
  - Middleware and mounts: guide/middleware-routing.md
  - WebSockets and streaming: guide/realtime.md
  - Deployment: guide/deployment.md
  - Testing and typing: guide/testing-typing.md
  - Migrating from 1.x: guide/migration.md
  - Benchmarks: guide/benchmarks.md
