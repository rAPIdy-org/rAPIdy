[project]
name = "rapidy-client"
version = "0.1.0"
description = "Declarative async HTTP client for the rAPIdy family."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Daniil Grois", email = "daniil.grois@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx2>=2.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rapidy-core>=0.1,<0.2",
    "yarl>=1.18",
]

[project.optional-dependencies]
brotli = ["brotli>=1.1"]
http2 = ["h2>=4.1"]
testing = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.0,<2.0",
]
zstd = ["zstandard>=0.23; python_version < '3.14'"]

[project.entry-points.pytest11]
rapidy_client = "rapidy_client.testing.plugin"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "rapidy_client"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
filterwarnings = ["error"]
