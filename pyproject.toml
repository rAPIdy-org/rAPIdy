# Virtual workspace root for the rAPIdy family. Published artifacts live in packages/*.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
rapidy-core = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-aiohttp>=1.0.5",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-httpserver>=1.0.8",
    "import-linter>=2.0,<3.0",
]

[tool.uv]
default-groups = ["dev"]
